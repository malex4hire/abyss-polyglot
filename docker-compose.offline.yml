# Egress-blocked overlay.
#
#   docker compose -f docker-compose.yml -f docker-compose.offline.yml up -d --wait
#
# The bridge keeps its host-side plumbing, so published ports still reach the demo, but
# masquerading is off: an outbound packet leaves with a container address no upstream
# router will answer, and name resolution past the embedded resolver goes with it. The
# containers talk to each other and to nobody else.
#
# `internal: true` is the obvious spelling and the wrong one. It removes the external
# bridge entirely, which takes port publishing with it, so every service comes up healthy
# by its own healthcheck and none of them is reachable from the laptop the demo runs on.
# What this is protecting against is a machine with no route to the internet, not a
# machine that cannot reach its own containers.
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
