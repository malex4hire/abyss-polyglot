[pytest]
testpaths = src/test
pythonpath = src
addopts = --strict-markers
# One marker per topic, so a single lesson's proof can be selected without naming files.
# Names carry underscores because marker names cannot contain hyphens.
markers =
    type_hints
    generics_typing
    collections
    comprehensions
    functions_args_kwargs
    classes_dunder
    dataclasses
    enums
    exceptions_custom
    iterators_generators
    decorators
    context_managers
    pattern_matching
    async_await
    async_gather
    modules_packages
    pytest_fixtures
    pytest_parametrize
