# Externalized configuration. Every value here can be overridden by an environment
# variable or a command-line argument, in the precedence order StartupReport reports.
spring.application.name=spring-boot

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# The schema is Hibernate's to manage here. The traditional module writes its own DDL.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=spring_boot

management.endpoints.web.exposure.include=health,info,conditions,configprops
management.endpoint.health.show-details=always

demo.label=spring-boot
demo.seed-count=6
