# The side-by-side page. Static documents, no proxy, no upstream.
#
# It needs none: each frame loads a frontend directly from the browser, and each frontend
# proxies its own backend calls. So this service can serve a broken page and the two
# applications carry on working — which is the right failure mode for a page whose whole
# job is to look at two things that already work.
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }
}
